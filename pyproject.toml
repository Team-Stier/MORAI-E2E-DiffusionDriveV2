[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "morai-ddv2"
version = "0.1.0"
description = "ROS bag fine-tuning for DiffusionDriveV2"
requires-python = ">=3.8,<3.10"
dependencies = ["cloudpickle", "h5py>=3.10", "numpy"]

[project.scripts]
morai-extract = "morai_ddv2.extract:main"
morai-train = "morai_ddv2.train:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

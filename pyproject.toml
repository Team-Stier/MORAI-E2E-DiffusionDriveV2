[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "morai-ddv2"
version = "0.1.0"
description = "Deterministic MORAI DiffusionDriveV2 preprocessing and training"
requires-python = ">=3.8,<3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a working CUDA-capable GPU and driver",
    "realbag: requires local production ROS bag data",
    "upstream: requires pinned upstream source checkouts and model assets",
]
